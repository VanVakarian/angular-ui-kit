<ng-content select="[v-corner-pic]" />

<div class="header"
     (click)="toggle()">
  <div class="header-content">
    <ng-content select="[v-header]" />
  </div>

  @if (isChevronVisible()) {
    <v-icon class="chevron"
            [class.expanded]="isPanelExpanded()"
            [name]="Icon.KeyboardArrowDown"
            [size]="5" />
  }
</div>

<div class="body"
     [class.expanded]="isPanelExpanded()">
  <ng-content select="[v-body]" />
</div>
