@if (settings$$().label || settings$$().labelRight) {
  <label class="label"
         [class.label-split]="!!settings$$().labelRight"
         [for]="inputId">
    <span>{{ settings$$().label }}</span>
    @if (settings$$().labelRight) {
      <span class="label-right">{{ settings$$().labelRight }}</span>
    }
  </label>
}

<div class="input-wrapper"
     [class.focused]="isFocused$$()"
     [class.clickable-readonly]="settings$$().isReadonly && settings$$().isClickable"
     [class.disabled]="settings$$().isDisabled"
     (mousedown)="onWrapperMouseDown($event)">

  <div class="prefix">
    <ng-content select="[v-prefix]" />
  </div>

  @if (settings$$().isTextarea) {
    <textarea #inputElement
              [id]="inputId"
              [value]="displayValue$$()"
              [name]="settings$$().name || inputId"
              [placeholder]="settings$$().placeholder"
              [disabled]="settings$$().isDisabled"
              [readonly]="settings$$().isReadonly"
              [rows]="settings$$().rows"
              [cols]="settings$$().cols"
              [style.text-align]="settings$$().textAlign"
              [style.--v-input-font-weight]="settings$$().fontWeight"
              [style.--v-input-font-size]="settings$$().fontSize"
              class="input-field textarea-field"
              (input)="onInputChange($event)"
              (change)="onInputChange($event)"
              (compositionstart)="onCompositionStart()"
              (compositionend)="onCompositionEnd()"
              (focus)="onFocus()"
              (blur)="onBlur()"
              (keydown)="onKeydown($event)"></textarea>
  } @else {
    <input #inputElement
           [id]="inputId"
           [value]="displayValue$$()"
           [name]="settings$$().name || inputId"
           [type]="settings$$().type"
           [placeholder]="settings$$().placeholder"
           [disabled]="settings$$().isDisabled"
           [readonly]="settings$$().isReadonly"
           [attr.size]="settings$$().inputSize"
           [attr.inputmode]="settings$$().inputmode || null"
           [attr.pattern]="settings$$().pattern || null"
           [style.text-align]="settings$$().textAlign"
           [style.--v-input-font-weight]="settings$$().fontWeight"
           [style.--v-input-font-size]="settings$$().fontSize"
           class="input-field"
           (input)="onInputChange($event)"
           (change)="onInputChange($event)"
           (compositionstart)="onCompositionStart()"
           (compositionend)="onCompositionEnd()"
           (focus)="onFocus()"
           (blur)="onBlur()"
           (keydown)="onKeydown($event)" />
  }

  <div class="postfix">
    <ng-content select="[v-postfix]" />
  </div>

</div>

@if (errorMessage$$()) {
  <div class="error-message">
    {{ errorMessage$$() }}
  </div>
}
